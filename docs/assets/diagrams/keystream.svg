<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="t d">
<!-- source: docs/headless/02-wire-protocol.md, "The keystream" -->
<!-- source: "Each direction keeps three 64-word lagged Fibonacci registers, initialized from that direction's seed value. Each register starts at index 63 with carry zero." -->
<!-- source: "1. Compute the majority of the three carry bits." -->
<!-- source: "2. Only registers whose carry matches that majority step." -->
<!-- source: "3. The lag pairs are (55, 24), (57, 7), and (58, 19) for registers 0, 1, and 2 respectively." -->
<!-- source: "4. XOR the three current register words to produce the keystream word." -->
<!-- source: "Consume each keystream word least significant byte first, XORing one keystream byte with each body byte." -->
<title id="t">The keystream</title>
<desc id="d">Three 64-word registers per direction, with lag pairs (55, 24), (57, 7) and (58, 19) for registers 0, 1 and 2. Each register's carry bit feeds the majority of the three carry bits; only registers whose carry matches that majority step. The three current register words are XORed to produce the keystream word, which is consumed least significant byte first, one keystream byte per body byte. Each direction keeps its own three registers, and each register starts at index 63 with carry zero.</desc>
<defs>
  <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L8 4 L0 8 Z" fill="#7a7a7a"/>
  </marker>
  <marker id="w" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0 0 L8 4 L0 8 Z" fill="#e8e8e8"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="879" height="399" fill="#000000" stroke="#7a7a7a" stroke-width="1"/>
<g font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace">

  <line x1="40" y1="40" x2="70" y2="40" stroke="#7a7a7a" stroke-width="1.25"/>
  <text x="80" y="44" font-size="13" fill="#7a7a7a">carry bit</text>
  <line x1="40" y1="62" x2="70" y2="62" stroke="#7a7a7a" stroke-width="1.25" stroke-dasharray="4 4"/>
  <text x="80" y="66" font-size="13" fill="#7a7a7a">step: only if its carry</text>
  <text x="80" y="82" font-size="13" fill="#7a7a7a">matches the majority</text>
  <line x1="40" y1="102" x2="70" y2="102" stroke="#e8e8e8" stroke-width="2"/>
  <text x="80" y="106" font-size="13" fill="#7a7a7a">current word</text>

  <rect x="300" y="36" width="280" height="48" fill="#1a1a1a" stroke="#7a7a7a" stroke-width="1"/>
  <text x="440" y="57" font-size="15" fill="#e8e8e8" text-anchor="middle">majority</text>
  <text x="440" y="75" font-size="13" fill="#7a7a7a" text-anchor="middle">of the three carry bits</text>

  <g stroke="#7a7a7a" stroke-width="1.25" fill="none">
    <line x1="70" y1="170" x2="310" y2="86" marker-end="url(#a)"/>
    <line x1="400" y1="170" x2="420" y2="86" marker-end="url(#a)"/>
    <line x1="630" y1="170" x2="530" y2="86" marker-end="url(#a)"/>
  </g>
  <g stroke="#7a7a7a" stroke-width="1.25" fill="none" stroke-dasharray="4 4">
    <line x1="350" y1="84" x2="250" y2="168" marker-end="url(#a)"/>
    <line x1="460" y1="84" x2="480" y2="168" marker-end="url(#a)"/>
    <line x1="570" y1="84" x2="810" y2="168" marker-end="url(#a)"/>
  </g>

  <g fill="#1a1a1a" stroke="#7a7a7a" stroke-width="1">
    <rect x="40" y="170" width="240" height="64"/>
    <rect x="320" y="170" width="240" height="64"/>
    <rect x="600" y="170" width="240" height="64"/>
  </g>
  <g text-anchor="middle">
    <text x="160" y="198" font-size="15" fill="#e8e8e8">register 0</text>
    <text x="160" y="218" font-size="13" fill="#7a7a7a">64 words · lags (55, 24)</text>
    <text x="440" y="198" font-size="15" fill="#e8e8e8">register 1</text>
    <text x="440" y="218" font-size="13" fill="#7a7a7a">64 words · lags (57, 7)</text>
    <text x="720" y="198" font-size="15" fill="#e8e8e8">register 2</text>
    <text x="720" y="218" font-size="13" fill="#7a7a7a">64 words · lags (58, 19)</text>
  </g>

  <g stroke="#e8e8e8" stroke-width="2" fill="none">
    <line x1="160" y1="234" x2="418" y2="291" marker-end="url(#w)"/>
    <line x1="440" y1="234" x2="440" y2="274" marker-end="url(#w)"/>
    <line x1="720" y1="234" x2="462" y2="291" marker-end="url(#w)"/>
    <line x1="463" y1="300" x2="596" y2="300" marker-end="url(#w)"/>
  </g>
  <g stroke="#7a7a7a" stroke-width="1.25" fill="none">
    <circle cx="440" cy="300" r="22" fill="#1a1a1a"/>
    <line x1="440" y1="284" x2="440" y2="316"/>
    <line x1="424" y1="300" x2="456" y2="300"/>
  </g>
  <text x="440" y="345" font-size="13" fill="#7a7a7a" text-anchor="middle">XOR the three current register words</text>

  <rect x="600" y="276" width="240" height="48" fill="#000000" stroke="#7a7a7a" stroke-width="1"/>
  <text x="720" y="297" font-size="15" fill="#e8e8e8" text-anchor="middle">keystream word</text>
  <text x="720" y="315" font-size="13" fill="#7a7a7a" text-anchor="middle">least significant byte first</text>
  <text x="720" y="345" font-size="13" fill="#7a7a7a" text-anchor="middle">one keystream byte per body byte</text>

  <line x1="24" y1="362" x2="856" y2="362" stroke="#3a3a3a" stroke-width="1"/>
  <text x="440" y="384" font-size="13" fill="#7a7a7a" text-anchor="middle">each direction keeps its own three registers  ·  each register starts at index 63 with carry zero</text>
</g>
</svg>
