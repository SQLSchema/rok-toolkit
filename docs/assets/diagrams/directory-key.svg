<!-- source: "ANDKOREA_10111_628822_25   Korea 1.1.11.25 (versionCode 1011125)" -->
<title id="t">The directory key</title>
<desc id="d">The International key AND_10105_587437_22, for client version 1.1.5.22 with versionCode 1010522, split into its four parts: the prefix AND; the versionCode without its last 2 digits, 1010522 becoming 10105; the resourceVersion 587437; and the last segment of the client version, 1.1.5.22 giving 22. The Vietnam key is ANDVN_10106_587437_18 and the Korea key is ANDKOREA_10111_628822_25.</desc>
<rect x="0.5" y="0.5" width="879" height="255" fill="#000000" stroke="#7a7a7a" stroke-width="1"/>
<g font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace">
  <text x="440" y="44" font-size="13" fill="#7a7a7a" text-anchor="middle">International  ·  1.1.5.22  ·  versionCode 1010522</text>

  <g fill="#1a1a1a" stroke="#7a7a7a" stroke-width="1">
    <rect x="164" y="60" width="96" height="52"/>
    <rect x="288" y="60" width="140" height="52"/>
    <rect x="456" y="60" width="160" height="52"/>
    <rect x="644" y="60" width="72" height="52"/>
  </g>
  <g font-size="24" text-anchor="middle">
    <text x="212" y="95" fill="#e8e8e8">AND</text>
    <text x="274" y="95" fill="#7a7a7a">_</text>
    <text x="358" y="95" fill="#e8e8e8">10105</text>
    <text x="442" y="95" fill="#7a7a7a">_</text>
    <text x="536" y="95" fill="#e8e8e8">587437</text>
    <text x="630" y="95" fill="#7a7a7a">_</text>
    <text x="680" y="95" fill="#e8e8e8">22</text>
  </g>

  <g stroke="#7a7a7a" stroke-width="1" fill="none">
    <path d="M168 120 V126 H256 V120"/>
    <path d="M292 120 V126 H424 V120"/>
    <path d="M460 120 V126 H612 V120"/>
    <path d="M648 120 V126 H712 V120"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="212" y="148" fill="#e8e8e8">prefix</text>
    <text x="358" y="148" fill="#e8e8e8">versionCode</text>
    <text x="358" y="166" fill="#7a7a7a">without last 2 digits</text>
    <text x="358" y="186" fill="#7a7a7a">1010522 → 10105</text>
    <text x="536" y="148" fill="#e8e8e8">resourceVersion</text>
    <text x="680" y="148" fill="#e8e8e8">client version</text>
    <text x="680" y="166" fill="#7a7a7a">last segment</text>
    <text x="680" y="186" fill="#7a7a7a">1.1.5.22 → 22</text>
  </g>

  <line x1="24" y1="210" x2="856" y2="210" stroke="#3a3a3a" stroke-width="1"/>
  <text x="440" y="236" font-size="13" fill="#7a7a7a" text-anchor="middle">Vietnam  ANDVN_10106_587437_18  ·  Korea  ANDKOREA_10111_628822_25</text>
</g>
</svg>
